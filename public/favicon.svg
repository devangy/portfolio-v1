<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#060810"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="8" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.3"/>
  <!-- > chevron -->
  <polyline points="6,11 13.5,16 6,21" fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- _ cursor -->
  <line x1="16.5" y1="21.5" x2="25.5" y2="21.5" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
</svg>
